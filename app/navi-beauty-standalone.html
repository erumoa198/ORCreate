:root {

  --bg-deep:   #E9E1D4;   /* サンドパネル */
  --paper:     #FCFBF8;   /* 紙/カード */
  --ink:       #221E1A;   /* 墨 */
  --ink-2:     #6B6258;   /* トープグレー */
  --ink-3:     #A89E8F;   /* 淡いトープ */

  --blush-2:   #F2E2D9;

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.85;
  letter-spacing: 0.012em;
  font-weight: 400;
  overflow-x: hidden;
  font-feature-settings: "palt" 1;
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
ul, ol { list-style: none; }
svg { display: block; }

/* タイポグラフィ基礎 */
.en { font-family: var(--serif-en); font-weight: 600; letter-spacing: 0.005em; }
.kicker {
  font-family: var(--sans-en); font-weight: 500; font-size: 0.66rem;
  letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent-deep);
}
.kicker--muted { color: var(--ink-3); }
.idx { font-family: var(--serif-en); font-weight: 600; color: var(--accent); }

h1,h2,h3,h4 { font-family: var(--serif-jp); font-weight: 600; line-height: 1.45; letter-spacing: 0.02em; }

/* ===== アプリシェル ===== */
.app {
  max-width: var(--maxw);
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

.app-header {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 80;
  width: 100%; max-width: var(--maxw); height: calc(var(--header-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) var(--pad) 0;
  display: flex; align-items: center; justify-content: space-between;
  transition: background 0.4s var(--ease), border-color 0.4s var(--ease);
  border-bottom: 1px solid transparent;
}
.app-header.solid { background: rgba(243,239,232,0.86); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom-color: var(--hair-soft); }
.app-header__logo { display: flex; align-items: baseline; gap: 7px; }
.app-header__logo b { font-family: var(--serif-en); font-weight: 600; font-size: 1.45rem; letter-spacing: 0.01em; line-height: 1; }
.app-header__logo span { font-family: var(--sans-en); font-weight: 500; font-size: 0.56rem; letter-spacing: 0.34em; text-transform: uppercase; color: var(--ink-2); }
.app-header__back { width: 42px; height: 42px; margin-left: -10px; display: none; align-items: center; justify-content: center; color: var(--ink); border-radius: 50%; }
.app-header__back svg { width: 22px; height: 22px; }
.app-header__back:active { background: var(--hair-soft); }
body[data-subpage="1"] .app-header__back { display: flex; }
body[data-subpage="1"] .app-header__logo { display: none; }
.app-header__line { font-family: var(--sans-en); font-weight: 600; font-size: 0.6rem; letter-spacing: 0.2em; color: var(--line-deep); border: 1px solid rgba(6,199,85,0.4); border-radius: 999px; padding: 6px 12px; }

.app-main { padding-top: calc(var(--header-h) + env(safe-area-inset-top)); padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 20px); min-height: 100dvh; }
.app-main.view-enter { animation: viewIn 0.5s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* 没入モード（診断中）: ヘッダー薄く・タブ非表示 */
body[data-immersive="1"] .tabbar { display: none; }
body[data-immersive="1"] .app-main { padding-bottom: env(safe-area-inset-bottom); }

/* ===== ボトムナビ（ラインアイコン） ===== */
.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 80;
  width: 100%; max-width: var(--maxw);
  height: calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding: 0 8px env(safe-area-inset-bottom);
  display: flex; align-items: center;
  background: rgba(252,251,248,0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--hair-soft);
}
.tabbar__item { flex: 1; height: var(--tab-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: var(--ink-3); transition: color 0.3s var(--ease); position: relative; }
.tabbar__item svg { width: 22px; height: 22px; stroke-width: 1.5; transition: transform 0.3s var(--ease); }
.tabbar__item span { font-family: var(--sans); font-size: 0.6rem; letter-spacing: 0.06em; }
.tabbar__item.active { color: var(--ink); }
.tabbar__item.active svg { transform: translateY(-1px); stroke: var(--accent-deep); }
.tabbar__item.active::after { content: ""; position: absolute; top: 11px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

/* ===== セクション/共通 ===== */
.sec { padding: 40px var(--pad); }
.sec--tight { padding-top: 14px; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.sec-head__l { min-width: 0; }
.sec-title { font-size: 1.5rem; line-height: 1.35; margin-top: 6px; }
.sec-title .en { font-size: 1.85rem; }
.sec-sub { color: var(--ink-2); font-size: 0.85rem; margin-top: 8px; max-width: 34ch; }
.more { font-family: var(--sans-en); font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.more svg { width: 14px; height: 14px; }

.hairline { height: 1px; background: var(--hair); border: 0; }

/* ボタン（エディトリアル） */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--sans); font-weight: 700; font-size: 0.92rem; letter-spacing: 0.04em; padding: 17px 26px; border-radius: 2px; transition: transform 0.16s var(--ease), opacity 0.2s, background 0.3s; }
.btn:active { transform: scale(0.98); }
.btn svg { width: 17px; height: 17px; }
.btn--fill { background: var(--ink); color: var(--bg); }
.btn--fill:active { background: #000; }
.btn--accent { background: var(--accent-deep); color: #fff; }
.btn--ghost { background: transparent; color: var(--ink); border: 1px solid var(--hair); }
.btn--line { background: var(--line); color: #fff; }
.btn--block { display: flex; width: 100%; }
.btn--lg { padding: 19px 28px; font-size: 0.98rem; }
.textlink { display: inline-flex; align-items: center; gap: 9px; font-family: var(--sans-en); font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); border-bottom: 1px solid var(--ink); padding-bottom: 5px; }
.textlink svg { width: 15px; height: 15px; transition: transform 0.25s var(--ease); }
.textlink:active svg { transform: translateX(4px); }

/* ===== カバー（画像の代わりの上質デュオトーン＋グレイン） ===== */
.cover { position: relative; overflow: hidden; background: var(--blush); isolation: isolate; }
.cover::after { content: ""; position: absolute; inset: 0; background-image: var(--grain); background-size: 160px; opacity: 0.5; mix-blend-mode: multiply; pointer-events: none; }
.cover--rose { background: linear-gradient(155deg, #E9CDC4 0%, #B07A73 100%); }
.cover--clay { background: linear-gradient(155deg, #DCC8B4 0%, #9C7B62 100%); }
.cover--sage { background: linear-gradient(155deg, #CDD2C4 0%, #828A6F 100%); }
.cover--plum { background: linear-gradient(155deg, #D6C2C8 0%, #7C5C66 100%); }
.cover--sand { background: linear-gradient(155deg, #EFE5D4 0%, #C7AE8C 100%); }
.cover__no { position: absolute; top: 14px; left: 16px; font-family: var(--serif-en); font-weight: 600; font-size: 1.2rem; color: rgba(255,255,255,0.9); letter-spacing: 0.05em; }
.cover__motif { position: absolute; right: -8px; bottom: -10px; width: 96px; height: 96px; color: rgba(255,255,255,0.42); }
.cover__motif svg { width: 100%; height: 100%; stroke-width: 1; }

/* ============================================================
   HOME
   ============================================================ */
.hero { position: relative; z-index: 0; padding: 34px var(--pad) 30px; }
.hero__inner { position: relative; z-index: 1; }
.hero__kick { margin-bottom: 26px; }
.hero__title { font-family: var(--serif-en); font-weight: 600; font-size: clamp(3.4rem, 17vw, 4.6rem); line-height: 0.94; letter-spacing: 0.005em; color: var(--ink); }
.hero__title em { font-style: italic; color: var(--accent-deep); }
.hero__jp { font-family: var(--serif-jp); font-weight: 600; font-size: 1.12rem; line-height: 1.7; margin-top: 22px; color: var(--ink); }
.hero__lead { color: var(--ink-2); font-size: 0.86rem; margin-top: 16px; max-width: 30ch; }
.hero__cta { margin-top: 30px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.hero__art { position: absolute; right: -30px; top: 40px; width: 190px; height: 250px; color: var(--accent); opacity: 0.45; pointer-events: none; z-index: 0; }
.hero__art svg { width: 100%; height: 100%; stroke-width: 0.9; }

/* INDEX（雑誌の目次） */
.index-list { border-top: 1px solid var(--hair); }
.index-row { display: flex; align-items: center; gap: 18px; padding: 22px 0; border-bottom: 1px solid var(--hair); transition: padding 0.3s var(--ease); }
.index-row:active { padding-left: 6px; }
.index-row__no { font-family: var(--serif-en); font-weight: 600; font-size: 1.05rem; color: var(--accent); width: 30px; flex: none; }
.index-row__body { flex: 1; min-width: 0; }
.index-row__name { font-family: var(--serif-jp); font-weight: 600; font-size: 1.32rem; line-height: 1.2; }
.index-row__en { font-family: var(--sans-en); font-size: 0.62rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }
.index-row__arrow { color: var(--ink-3); }
.index-row__arrow svg { width: 20px; height: 20px; }

/* 横スクロール */
.rail { display: flex; gap: 16px; overflow-x: auto; padding: 4px var(--pad) 10px; margin: 0 calc(var(--pad) * -1); scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.rail::after { content: ""; flex: 0 0 calc(var(--pad) - 16px); }

/* 診断カバーカード */
.dcover { flex: none; width: 230px; scroll-snap-align: start; }
.dcover__img { height: 290px; border-radius: 4px; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
.dcover__tag { align-self: flex-start; font-family: var(--sans-en); font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase; color: #fff; border: 1px solid rgba(255,255,255,0.55); border-radius: 999px; padding: 4px 11px; margin-bottom: auto; }
.dcover__no { font-family: var(--serif-en); font-weight: 600; font-size: 2.4rem; color: rgba(255,255,255,0.85); line-height: 1; }
.dcover__name { font-family: var(--serif-jp); font-weight: 600; color: #fff; font-size: 1.18rem; margin-top: 8px; line-height: 1.4; }
.dcover__meta { margin-top: 12px; font-size: 0.74rem; color: var(--ink-2); }
.dcover__sub { font-size: 0.76rem; color: var(--ink-2); margin-top: 4px; line-height: 1.6; }

/* CONCEPT */
.concept { background: var(--bg-deep); margin: 0; padding: 54px var(--pad); position: relative; overflow: hidden; }
.concept__q { font-family: var(--serif-jp); font-weight: 600; font-size: 1.5rem; line-height: 1.75; letter-spacing: 0.04em; }
.concept__q em { font-style: normal; color: var(--accent-deep); }
.concept__body { color: var(--ink-2); font-size: 0.84rem; margin-top: 18px; }

/* JOURNAL teaser */
.feature { display: block; }
.feature__img { height: 220px; border-radius: 4px; margin-bottom: 16px; position: relative; }
.feature__tag { position: absolute; top: 14px; left: 14px; font-family: var(--sans-en); font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase; color: #fff; }
.feature__title { font-family: var(--serif-jp); font-weight: 600; font-size: 1.28rem; line-height: 1.5; }
.feature__meta { font-family: var(--sans-en); font-size: 0.64rem; letter-spacing: 0.14em; color: var(--ink-3); margin-top: 10px; text-transform: uppercase; }

/* LINE CTA バンド */
.cta-band { padding: 46px var(--pad); text-align: center; }
.cta-band__t { font-family: var(--serif-jp); font-weight: 600; font-size: 1.3rem; line-height: 1.6; margin-bottom: 8px; }
.cta-band__s { color: var(--ink-2); font-size: 0.82rem; margin-bottom: 24px; }

.note { font-size: 0.66rem; color: var(--ink-3); text-align: center; letter-spacing: 0.04em; padding: 10px var(--pad); }

/* ============================================================
   診断一覧（大判カバー）
   ============================================================ */
.page-head { padding: 16px var(--pad) 26px; }
.page-head__no { font-family: var(--serif-en); font-weight: 600; font-size: 0.9rem; color: var(--accent); letter-spacing: 0.1em; }
.page-head__title { font-size: 1.9rem; margin-top: 6px; }
.page-head__title .en { font-size: 2.3rem; }
.page-head__sub { color: var(--ink-2); font-size: 0.85rem; margin-top: 10px; max-width: 36ch; }

.dlist { padding: 0 var(--pad) 20px; display: flex; flex-direction: column; gap: 18px; }
.dbig { display: block; border-radius: 5px; overflow: hidden; }
.dbig__img { height: 230px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; }
.dbig__top { display: flex; justify-content: space-between; align-items: flex-start; }
.dbig__no { font-family: var(--serif-en); font-weight: 600; font-size: 2.6rem; color: rgba(255,255,255,0.9); line-height: 1; }
.dbig__tag { font-family: var(--sans-en); font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase; color: #fff; border: 1px solid rgba(255,255,255,0.5); border-radius: 999px; padding: 5px 12px; }
.dbig__name { font-family: var(--serif-jp); font-weight: 600; color: #fff; font-size: 1.5rem; line-height: 1.4; }
.dbig__sub { color: var(--ink-2); font-size: 0.82rem; margin-top: 12px; display: flex; align-items: center; justify-content: space-between; }
.dbig__go { display: inline-flex; align-items: center; gap: 7px; font-family: var(--sans-en); font-size: 0.64rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); }
.dbig__go svg { width: 15px; height: 15px; }

/* ============================================================
   QUIZ（没入・1問1画面）
   ============================================================ */
.quiz { min-height: 100dvh; display: flex; flex-direction: column; padding: calc(var(--header-h) + env(safe-area-inset-top) + 8px) var(--pad) calc(env(safe-area-inset-bottom) + 26px); }
.quiz__bar { position: fixed; top: calc(env(safe-area-inset-top)); left: 0; width: 100%; height: 2px; background: var(--hair-soft); z-index: 90; }
.quiz__bar > span { display: block; height: 100%; background: var(--accent-deep); transition: width 0.5s var(--ease); }
.quiz__count { font-family: var(--serif-en); font-weight: 600; font-size: 0.95rem; color: var(--accent); letter-spacing: 0.1em; margin-bottom: 26px; }
.quiz__count b { color: var(--ink); }
.quiz__q { font-family: var(--serif-jp); font-weight: 600; font-size: 1.62rem; line-height: 1.6; letter-spacing: 0.02em; margin-bottom: 34px; }
.quiz__opts { display: flex; flex-direction: column; }
.qopt { text-align: left; width: 100%; padding: 21px 4px; display: flex; align-items: center; gap: 16px; border-top: 1px solid var(--hair); font-size: 0.98rem; font-weight: 500; line-height: 1.6; color: var(--ink); transition: padding 0.3s var(--ease), color 0.2s; }
.qopt:last-child { border-bottom: 1px solid var(--hair); }
.qopt:active { padding-left: 12px; color: var(--accent-deep); }
.qopt__mk { flex: none; width: 26px; font-family: var(--serif-en); font-weight: 600; font-size: 1rem; color: var(--accent); }
.qopt__ar { margin-left: auto; color: var(--ink-3); opacity: 0; transition: opacity 0.2s; }
.qopt:active .qopt__ar { opacity: 1; }
.qopt__ar svg { width: 18px; height: 18px; }
.quiz__back { margin-top: 34px; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-family: var(--sans-en); font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); }
.quiz__back svg { width: 15px; height: 15px; }
.quiz-anim { animation: qIn 0.45s var(--ease); }
@keyframes qIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }

/* ============================================================
   RESULT
   ============================================================ */
.r-hero { padding: 24px var(--pad) 34px; }
.r-hero__kick { margin-bottom: 18px; }
.r-hero__title { font-family: var(--serif-jp); font-weight: 600; font-size: 2.3rem; line-height: 1.3; letter-spacing: 0.02em; }
.r-hero__catch { font-family: var(--serif-en); font-weight: 600; font-style: italic; font-size: 1.25rem; color: var(--accent-deep); margin-top: 14px; line-height: 1.5; }
.r-hero__sum { color: var(--ink-2); font-size: 0.9rem; margin-top: 20px; }

.adv { counter-reset: a; border-top: 1px solid var(--hair); }
.adv li { counter-increment: a; position: relative; padding: 20px 0 20px 46px; border-bottom: 1px solid var(--hair); font-size: 0.9rem; line-height: 1.7; }
.adv li::before { content: counter(a, decimal-leading-zero); position: absolute; left: 0; top: 19px; font-family: var(--serif-en); font-weight: 600; font-size: 1rem; color: var(--accent); }

/* QR — 設計されたオブジェクト */
.qr-panel { background: var(--ink); color: var(--bg); margin: 8px var(--pad); border-radius: 6px; padding: 38px 28px; text-align: center; position: relative; overflow: hidden; }
.qr-panel__kick { font-family: var(--sans-en); font-size: 0.64rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--blush); }
.qr-panel__t { font-family: var(--serif-jp); font-weight: 600; font-size: 1.3rem; margin: 12px 0 6px; color: var(--bg); }
.qr-panel__s { font-size: 0.78rem; color: rgba(243,239,232,0.66); margin-bottom: 26px; }
.qr-frame { display: inline-block; padding: 16px; background: #fff; border-radius: 4px; }
.qr-frame svg { width: 196px; height: 196px; display: block; }
.qr-panel__note { font-size: 0.72rem; color: rgba(243,239,232,0.55); margin-top: 20px; line-height: 1.7; }

/* おすすめ（カバーカード小） */
.rec { flex: none; width: 170px; scroll-snap-align: start; }
.rec__img { height: 200px; border-radius: 4px; }
.rec__cat { font-family: var(--sans-en); font-size: 0.58rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); margin-top: 12px; }
.rec__name { font-family: var(--serif-jp); font-weight: 600; font-size: 0.98rem; line-height: 1.4; margin-top: 5px; }
.rec__price { font-family: var(--serif-en); font-weight: 600; font-size: 1.08rem; color: var(--ink); margin-top: 7px; }

/* ============================================================
   MENU
   ============================================================ */
.seg { display: flex; gap: 24px; padding: 0 var(--pad); border-bottom: 1px solid var(--hair); margin-bottom: 6px; }
.seg__b { padding: 14px 0; font-family: var(--sans); font-weight: 700; font-size: 0.9rem; color: var(--ink-3); position: relative; transition: color 0.25s; }
.seg__b.active { color: var(--ink); }
.seg__b.active::after { content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--accent-deep); }

.mrow { display: flex; gap: 18px; padding: 24px var(--pad); border-bottom: 1px solid var(--hair); align-items: flex-start; }
.mrow__sw { flex: none; width: 76px; height: 76px; border-radius: 4px; }
.mrow__b { flex: 1; min-width: 0; }
.mrow__name { font-family: var(--serif-jp); font-weight: 600; font-size: 1.12rem; line-height: 1.35; }
.mrow__sum { color: var(--ink-2); font-size: 0.8rem; margin: 7px 0 10px; }
.mrow__foot { display: flex; align-items: baseline; gap: 12px; }
.mrow__price { font-family: var(--serif-en); font-weight: 600; font-size: 1.2rem; color: var(--ink); }
.mrow__dur { font-family: var(--sans-en); font-size: 0.66rem; letter-spacing: 0.1em; color: var(--ink-3); text-transform: uppercase; }
.mtags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.mtag { font-size: 0.64rem; letter-spacing: 0.04em; color: var(--ink-2); border: 1px solid var(--hair); border-radius: 999px; padding: 4px 11px; }

/* ============================================================
   PRODUCTS
   ============================================================ */
.pgrid { padding: 6px var(--pad) 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px 16px; }
.pcard { display: block; }
.pcard__img { aspect-ratio: 3/4; border-radius: 4px; position: relative; }
.pcard__cat { font-family: var(--sans-en); font-size: 0.56rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); margin-top: 12px; }
.pcard__name { font-family: var(--serif-jp); font-weight: 600; font-size: 0.98rem; line-height: 1.4; margin-top: 4px; }
.pcard__sum { font-size: 0.72rem; color: var(--ink-2); margin-top: 6px; line-height: 1.6; min-height: 2.6em; }
.pcard__price { font-family: var(--serif-en); font-weight: 600; font-size: 1.18rem; margin-top: 8px; }

/* ============================================================
   TIPS / JOURNAL
   ============================================================ */
.facts { padding: 6px var(--pad) 10px; }
.fact { padding: 22px 0; border-bottom: 1px solid var(--hair); display: flex; gap: 18px; }
.fact:first-child { border-top: 1px solid var(--hair); }
.fact__no { font-family: var(--serif-en); font-weight: 600; font-size: 1.05rem; color: var(--accent); flex: none; width: 28px; }
.fact__t { font-family: var(--serif-jp); font-weight: 600; font-size: 1.02rem; line-height: 1.75; letter-spacing: 0.02em; }

.jlist { padding: 6px var(--pad) 20px; display: flex; flex-direction: column; }
.jrow { display: flex; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--hair); align-items: center; }
.jrow__img { flex: none; width: 92px; height: 92px; border-radius: 4px; }
.jrow__b { flex: 1; min-width: 0; }
.jrow__tag { font-family: var(--sans-en); font-size: 0.58rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-deep); }
.jrow__title { font-family: var(--serif-jp); font-weight: 600; font-size: 1.04rem; line-height: 1.45; margin: 5px 0; }
.jrow__meta { font-family: var(--sans-en); font-size: 0.62rem; letter-spacing: 0.1em; color: var(--ink-3); text-transform: uppercase; }

/* ARTICLE */
.article { padding: 8px var(--pad) 20px; }
.article__cover { height: 200px; border-radius: 5px; margin-bottom: 26px; }
.article__tag { font-family: var(--sans-en); font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-deep); }
.article__title { font-family: var(--serif-jp); font-weight: 600; font-size: 1.75rem; line-height: 1.45; margin: 12px 0 10px; }
.article__sub { color: var(--ink-2); font-size: 0.88rem; }
.article__meta { font-family: var(--sans-en); font-size: 0.62rem; letter-spacing: 0.14em; color: var(--ink-3); text-transform: uppercase; margin: 18px 0; }
.article__lead { font-family: var(--serif-jp); font-weight: 600; font-size: 1.12rem; line-height: 1.95; color: var(--ink); margin: 24px 0; }
.article p { font-size: 0.92rem; line-height: 2; color: var(--ink); margin-bottom: 22px; }

/* ===== レスポンシブ：横向き ===== */
@media (orientation: landscape) and (max-height: 540px) {
  .hero__title { font-size: clamp(2.6rem, 9vh, 3.4rem); }
  .quiz { padding-top: calc(var(--header-h) + 4px); }
  .quiz__q { font-size: 1.4rem; margin-bottom: 22px; }
  .qopt { padding: 15px 4px; }
}

/* ===== iPad / 大画面 ===== */
@media (min-width: 768px) {
  :root { --maxw: 768px; --pad: 56px; }
  .hero__title { font-size: 5.5rem; }

/* ============================================================
   情報アプリ用コンポーネント（フィード / 検索 / ランキング）
   ============================================================ */

/* 上部ブランド帯 */
.htop { padding: 14px var(--pad) 4px; display: flex; align-items: baseline; justify-content: space-between; }
.htop__brand { font-family: var(--serif-en); font-weight: 600; font-size: 1.05rem; }
.htop__loc { font-family: var(--sans-en); font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }

/* 検索バー */
.search { margin: 8px var(--pad) 4px; display: flex; align-items: center; gap: 10px; background: var(--paper); border: 1px solid var(--hair); border-radius: 999px; padding: 13px 18px; }
.search svg { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
.search span { font-size: 0.84rem; color: var(--ink-3); }

/* クイックアクセス */
.quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 16px var(--pad) 8px; }
.quick__i { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.quick__c { width: 50px; height: 50px; border-radius: 16px; background: var(--paper); border: 1px solid var(--hair); display: flex; align-items: center; justify-content: center; color: var(--accent-deep); transition: transform 0.18s var(--ease), background 0.2s; }
.quick__i:active .quick__c { transform: scale(0.92); background: var(--blush-2); }
.quick__c svg { width: 22px; height: 22px; }
.quick__l { font-size: 0.64rem; color: var(--ink-2); letter-spacing: 0.02em; }

/* ホーム：診断への主要導線カード */
.hbig { display: flex; align-items: center; gap: 14px; margin: 14px var(--pad) 4px; padding: 22px; border-radius: 18px; background: linear-gradient(135deg, #B98A82 0%, #8E574F 100%); color: #fff; position: relative; overflow: hidden; }
.hbig::after { content: ""; position: absolute; inset: 0; background-image: var(--grain); background-size: 160px; opacity: 0.4; mix-blend-mode: multiply; }
.hbig__c { position: relative; z-index: 1; flex: 1; }
.hbig__kick { font-family: var(--sans-en); font-size: 0.58rem; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.8); }
.hbig__t { display: block; font-family: var(--serif-jp); font-weight: 600; font-size: 1.4rem; line-height: 1.4; margin: 8px 0 6px; }
.hbig__s { font-size: 0.74rem; color: rgba(255,255,255,0.88); }
.hbig__ic { position: relative; z-index: 1; flex: none; width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.45); display: flex; align-items: center; justify-content: center; }
.hbig__ic svg { width: 24px; height: 24px; }

/* モジュール見出し */
.mod { display: flex; align-items: center; justify-content: space-between; padding: 26px var(--pad) 12px; }
.mod__l { display: flex; align-items: baseline; gap: 10px; }
.mod__t { font-family: var(--serif-jp); font-weight: 600; font-size: 1.18rem; letter-spacing: 0.02em; }
.mod__en { font-family: var(--sans-en); font-size: 0.58rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); }
.mod__more { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; color: var(--ink-2); }
.mod__more svg { width: 14px; height: 14px; }

/* バナー（ピックアップ） */
.banner { flex: none; width: 290px; height: 150px; border-radius: 12px; scroll-snap-align: start; padding: 18px; display: flex; flex-direction: column; justify-content: flex-end; }
.banner__cat { align-self: flex-start; font-family: var(--sans-en); font-size: 0.56rem; letter-spacing: 0.14em; text-transform: uppercase; color: #fff; background: rgba(0,0,0,0.18); border-radius: 999px; padding: 4px 11px; margin-bottom: auto; }
.banner__title { font-family: var(--serif-jp); font-weight: 600; font-size: 1.12rem; line-height: 1.4; color: #fff; }
.banner__date { font-family: var(--sans-en); font-size: 0.6rem; letter-spacing: 0.08em; color: rgba(255,255,255,0.85); margin-top: 6px; }

/* カード型フィード枠（アプリらしい面） */
.feed { background: var(--paper); border: 1px solid var(--hair); border-radius: 16px; margin: 0 var(--pad); padding: 4px 18px; }

/* ランキング行 */
.rk { display: flex; align-items: center; gap: 14px; padding: 15px 0; border-bottom: 1px solid var(--hair-soft); }
.rk:last-child { border-bottom: 0; }
.rk__n { flex: none; width: 24px; font-family: var(--serif-en); font-weight: 600; font-size: 1.5rem; color: var(--ink-3); text-align: center; line-height: 1; }
.rk__n--top { color: var(--accent-deep); }
.rk__img { flex: none; width: 56px; height: 56px; border-radius: 10px; }
.rk__b { flex: 1; min-width: 0; }
.rk__name { font-family: var(--serif-jp); font-weight: 600; font-size: 1rem; line-height: 1.4; }
.rk__meta { font-size: 0.7rem; color: var(--ink-2); margin-top: 3px; }
.rk__meta b { color: var(--accent-deep); font-family: var(--sans-en); }
.rk__price { font-family: var(--serif-en); font-weight: 600; font-size: 1.05rem; }
.rk__ar { color: var(--ink-3); flex: none; }
.rk__ar svg { width: 17px; height: 17px; }

/* 横スクロール（小カード：商品/診断） */
.mini { flex: none; width: 130px; scroll-snap-align: start; }
.mini__img { width: 130px; height: 130px; border-radius: 12px; position: relative; }
.mini__rank { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.35); color: #fff; font-family: var(--serif-en); font-weight: 600; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; }
.mini__name { font-family: var(--serif-jp); font-weight: 600; font-size: 0.84rem; line-height: 1.4; margin-top: 9px; }
.mini__price { font-family: var(--serif-en); font-weight: 600; font-size: 0.95rem; margin-top: 3px; }
.mini__cat { font-size: 0.62rem; color: var(--ink-3); margin-top: 6px; }

/* バッジ */
.badge { display: inline-block; font-family: var(--sans-en); font-size: 0.54rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 7px; border-radius: 4px; }
.badge--new { background: var(--accent-deep); color: #fff; }
.badge--hot { background: var(--blush-2); color: var(--accent-deep); }

/* お知らせ行 */
.nrow { display: flex; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--hair-soft); }
.nrow:last-child { border-bottom: 0; }
.nrow__date { font-family: var(--sans-en); font-size: 0.62rem; letter-spacing: 0.06em; color: var(--ink-3); flex: none; width: 64px; }
.nrow__cat { font-size: 0.6rem; color: var(--accent-deep); border: 1px solid var(--hair); border-radius: 999px; padding: 3px 9px; flex: none; }
.nrow__t { font-size: 0.84rem; line-height: 1.5; min-width: 0; }

/* コンセプト（コンパクト版） */
.concept--mini { padding: 34px var(--pad); }
.concept--mini .concept__q { font-size: 1.28rem; }

@media (min-width: 768px) {
  .quick { grid-template-columns: repeat(5, 1fr); max-width: 560px; }
  .mini, .mini__img { width: 150px; }
  .mini__img { height: 150px; }
}

/* ============================================================
   結果：解決アイテム（商品紹介の主役）
   ============================================================ */
.sol { background: var(--paper); border: 1px solid var(--hair); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.sol__head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.sol__img { flex: none; width: 76px; height: 76px; border-radius: 10px; }
.sol__hb { min-width: 0; }
.sol__cat { font-family: var(--sans-en); font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.sol__name { font-family: var(--serif-jp); font-weight: 600; font-size: 1.05rem; line-height: 1.4; margin: 2px 0 4px; }
.sol__price { font-family: var(--serif-en); font-weight: 600; font-size: 1.15rem; }
.sol__rows { display: flex; flex-direction: column; gap: 11px; border-top: 1px solid var(--hair-soft); padding-top: 14px; }
.sol__row { display: flex; gap: 11px; align-items: flex-start; }
.sol__lb { flex: none; font-family: var(--sans); font-weight: 700; font-size: 0.6rem; letter-spacing: 0.08em; color: var(--accent-deep); background: var(--blush-2); border-radius: 5px; padding: 4px 9px; margin-top: 1px; }
.sol__tx { font-size: 0.84rem; line-height: 1.7; color: var(--ink); }
.sol__more { display: inline-flex; align-items: center; gap: 6px; font-family: var(--sans-en); font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); margin-top: 14px; }
.sol__more svg { width: 14px; height: 14px; }

/* 関連メニュー（補助・コンパクト） */
.relmenu { display: flex; gap: 12px; align-items: center; padding: 14px var(--pad); border: 1px solid var(--hair); border-radius: 14px; margin: 0 var(--pad); }
.relmenu__sw { flex: none; width: 46px; height: 46px; border-radius: 8px; }
.relmenu__b { flex: 1; min-width: 0; }
.relmenu__lb { font-family: var(--sans-en); font-size: 0.56rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.relmenu__name { font-family: var(--serif-jp); font-weight: 600; font-size: 0.92rem; line-height: 1.35; }
.relmenu__price { font-family: var(--serif-en); font-weight: 600; font-size: 0.95rem; color: var(--ink-2); flex: none; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

      return '<button class="qopt" data-i="' + i + '"><span class="qopt__mk">' + marks[i] + '</span><span>' + esc(o.label) + '</span><span class="qopt__ar">' + I.arrow + '</span></button>';
    }).join('');
    var html = '<div class="quiz__bar"><span style="width:' + pct + '%"></span></div>'
      + '<section class="quiz quiz-anim">'
      +   '<div class="quiz__count"><b>' + pad2(idx + 1) + '</b> / ' + pad2(d.questions.length) + '</div>'
      +   '<h2 class="quiz__q">' + esc(q.q) + '</h2>'
      +   '<div class="quiz__opts">' + opts + '</div>'
      +   (idx > 0 ? '<button class="quiz__back" id="qBack">' + I.back + ' Back</button>' : '')
      + '</section>';
    setView(html, { sub: true, immersive: true, tab: 'diagnosis' });
    $$('.qopt').forEach(function (b) {
      b.addEventListener('click', function () { quizState.answers.push(parseInt(this.getAttribute('data-i'), 10)); renderQuiz(); });
    });
    var bk = $('#qBack'); if (bk) bk.addEventListener('click', function () { quizState.answers.pop(); renderQuiz(); });
  }
  function computeResult(d, answers) {
    var sc = {}; d.results.forEach(function (r) { sc[r.id] = 0; });
    answers.forEach(function (ai, qi) {
      var o = d.questions[qi].options[ai]; if (!o || !o.scores) return;
      Object.keys(o.scores).forEach(function (k) { sc[k] = (sc[k] || 0) + o.scores[k]; });
    });
    var best = d.results[0].id, bv = -Infinity;
    d.results.forEach(function (r) { if ((sc[r.id] || 0) > bv) { bv = sc[r.id] || 0; best = r.id; } });
    return best;
  }
  function finishQuiz() {
    var d = getDiag(quizState.id);
    go('#/r/' + encodeState({ d: d.id, r: computeResult(d, quizState.answers) }));
  }

  // ============================================================
  //  RESULT（共有可能）
  // ============================================================
  function viewResult(enc) {
    var st = decodeState(enc); if (!st) { go('#/diagnosis'); return; }
    var d = getDiag(st.d);
    var result = d && d.results.filter(function (r) { return r.id === st.r; })[0];
    if (!d || !result) { go('#/diagnosis'); return; }

    var advice = (result.advice || []).map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('');

    // 解決する商品（主役）：理由・効果つき
    var picks = (result.picks || []).map(function (pk) {
      var p = getProduct(pk.id); if (!p) return '';
      return '<a class="sol" href="#/products">'
        + '<div class="sol__head">'
        +   '<div class="sol__img cover ' + coverOf(productIndex(p.id)) + '"><span class="cover__motif" style="width:54px;height:54px;right:2px;bottom:2px">' + MOTIF.bottle + '</span></div>'
        +   '<div class="sol__hb"><div class="sol__cat">' + esc(p.tag) + '</div><div class="sol__name">' + esc(p.name) + '</div><div class="sol__price">' + esc(p.price) + '</div></div>'
        + '</div>'
        + '<div class="sol__rows">'
        +   '<div class="sol__row"><span class="sol__lb">理由</span><span class="sol__tx">' + esc(pk.reason) + '</span></div>'
        +   '<div class="sol__row"><span class="sol__lb">効果</span><span class="sol__tx">' + esc(pk.effect) + '</span></div>'
        + '</div>'
        + '<span class="sol__more">商品を見る ' + I.arrow + '</span>'
        + '</a>';
    }).join('');

    // 関連メニュー（補助）
    var menus = (result.menus || []).map(getMenu).filter(Boolean);
    var relMenu = menus.map(function (m) {
      return '<a class="relmenu" href="#/menu" style="margin-bottom:10px">'
        + '<div class="relmenu__sw cover ' + coverOf(menuIndex(m.id)) + '"></div>'
        + '<div class="relmenu__b"><div class="relmenu__lb">' + (m.category === 'esthe' ? 'Esthe Menu' : 'Artmake Menu') + '</div><div class="relmenu__name">' + esc(m.name) + '</div></div>'
        + '<div class="relmenu__price">' + esc(m.price) + '</div></a>';
    }).join('');

    var html = ''
      + '<section class="r-hero">'
      +   '<div class="kicker r-hero__kick">' + esc(d.title) + ' — Result</div>'
      +   '<h1 class="r-hero__title">' + esc(result.title) + '</h1>'
      +   '<p class="r-hero__catch">' + esc(result.catch) + '</p>'
      +   '<p class="r-hero__sum">' + esc(result.feature || result.summary || '') + '</p>'
      + '</section>'
      + '<section class="sec sec--tight"><div class="mod" style="padding:0 0 12px"><div class="mod__l"><span class="mod__t">対策・アドバイス</span><span class="mod__en">Advice</span></div></div>'
      +   '<ol class="adv">' + advice + '</ol></section>';

    if (picks) {
      html += '<section class="sec sec--tight"><div class="mod" style="padding:8px 0 14px"><div class="mod__l"><span class="mod__t">悩みを解決するアイテム</span><span class="mod__en">For You</span></div></div>'
        + picks + '</section>';
    }
    if (relMenu) {
      html += '<section class="sec sec--tight"><div class="mod" style="padding:8px 0 14px"><div class="mod__l"><span class="mod__t">あわせて検討</span><span class="mod__en">Menu</span></div></div></section>'
        + relMenu;
    }

    var shareUrl = location.origin + location.pathname + '#/r/' + enc;
    html += '<div class="qr-panel" style="margin-top:22px">'
      + '<div class="qr-panel__kick">Scan to Save</div>'
      + '<p class="qr-panel__t">結果をスマホに保存</p>'
      + '<p class="qr-panel__s">お客様のスマホで読み込むと、<br>いつでも結果と商品を見返せます。</p>'
      + '<div class="qr-frame"><div id="qrTarget"></div></div>'
      + '<p class="qr-panel__note">読み込み後はブックマーク推奨。<br>結果ページのURLが開きます。</p>'
      + '</div>'
      + '<section class="sec" style="display:flex;flex-direction:column;gap:12px">'
      +   '<a class="btn btn--line btn--block" href="#" onclick="return false">' + I.share + ' この内容でLINE相談・予約</a>'
      +   '<a class="btn btn--ghost btn--block" href="#/diagnosis">他の診断をする</a>'
      +   '<p class="note">※ 予約・LINE連携・購入は本番環境で接続予定（デザイン確認用）</p>'
      + '</section>';

    setView(html, { sub: true, tab: 'diagnosis' });
    if (window.NaviQR) window.NaviQR.render($('#qrTarget'), shareUrl, 196);
  }

  // ============================================================
  //  MENU
  // ============================================================
  function viewMenu(cat) {
    cat = cat || 'all';
    var seg = '<div class="seg"><button class="seg__b' + (cat === 'all' ? ' active' : '') + '" data-cat="all">すべて</button>'
      + DB.menus.categories.map(function (c) { return '<button class="seg__b' + (cat === c.id ? ' active' : '') + '" data-cat="' + c.id + '">' + esc(c.label) + '</button>'; }).join('')
      + '</div>';
    var rows = DB.menus.menus.filter(function (m) { return cat === 'all' || m.category === cat; }).map(function (m) {
      var tags = (m.points || []).map(function (p) { return '<span class="mtag">' + esc(p) + '</span>'; }).join('');
      return '<a class="mrow" href="#/menu">'
        + '<div class="mrow__sw cover ' + coverOf(menuIndex(m.id)) + '"><span class="cover__motif" style="width:54px;height:54px;right:2px;bottom:2px">' + (m.category === 'esthe' ? MOTIF.drop : MOTIF.brow) + '</span></div>'
        + '<div class="mrow__b"><div class="mrow__name">' + esc(m.name) + '</div>'
        +   '<div class="mrow__sum">' + esc(m.summary) + '</div>'
        +   '<div class="mrow__foot"><span class="mrow__price">' + esc(m.price) + '</span><span class="mrow__dur">' + esc(m.duration) + '</span></div>'
        +   '<div class="mtags">' + tags + '</div>'
        + '</div></a>';
    }).join('');
    var html = '<div class="page-head"><div class="kicker">Treatment</div><h1 class="page-head__title">メニュー</h1>'
      + '<p class="page-head__sub">アートメイク・エステの施術メニュー一覧です。</p></div>'
      + seg + '<div>' + rows + '</div>'
      + '<p class="note">※ 料金・内容はサンプルです（デザイン確認用）。予約導線は本番接続予定。</p>';
    setView(html, { tab: 'menu' });
    $$('.seg__b').forEach(function (b) { b.addEventListener('click', function () { viewMenu(this.getAttribute('data-cat')); }); });
  }

  // ============================================================
  //  PRODUCTS
  // ============================================================
  function viewProducts() {
    var grid = DB.products.map(function (p, i) {
      return '<a class="pcard" href="#/products"><div class="pcard__img cover ' + coverOf(i) + '"><span class="cover__motif">' + MOTIF.bottle + '</span></div>'
        + '<div class="pcard__cat">' + esc(p.tag) + '</div>'
        + '<div class="pcard__name">' + esc(p.name) + '</div>'
        + '<div class="pcard__sum">' + esc(p.summary) + '</div>'
        + '<div class="pcard__price">' + esc(p.price) + '</div></a>';
    }).join('');
    var html = '<div class="page-head"><div class="kicker">Online Shop</div><h1 class="page-head__title">商品</h1>'
      + '<p class="page-head__sub">Naviおすすめの美容アイテム。施術後のホームケアにも。</p></div>'
      + '<div class="pgrid">' + grid + '</div>'
      + '<p class="note">※ 商品・価格はサンプルです（デザイン確認用）。カート/決済は本番接続予定。</p>';
    setView(html, { tab: 'products' });
  }

  // ============================================================
  //  TIPS / JOURNAL
  // ============================================================
  function viewTips() {
    var facts = DB.tips.facts.map(function (f, i) {
      return '<div class="fact"><span class="fact__no">' + pad2(i + 1) + '</span><span class="fact__t">' + esc(f) + '</span></div>';
    }).join('');
    var rows = DB.tips.columns.map(function (c, i) {
      return '<a class="jrow" href="#/tips/' + c.id + '">'
        + '<div class="jrow__img cover ' + coverOf(i + 1) + '"><span class="cover__motif" style="width:56px;height:56px;right:2px;bottom:2px">' + MOTIF.brow + '</span></div>'
        + '<div class="jrow__b"><div class="jrow__tag">' + esc(c.tag) + '</div>'
        +   '<div class="jrow__title">' + esc(c.title) + '</div>'
        +   '<div class="jrow__meta">Read · 約' + c.minutes + ' min</div></div></a>';
    }).join('');
    var html = '<div class="page-head"><div class="kicker">Journal</div><h1 class="page-head__title">読みもの</h1>'
      + '<p class="page-head__sub">知っておくと役立つ、眉とアートメイクのこと。</p></div>'
      + '<section class="sec sec--tight"><div class="kicker" style="margin-bottom:6px">Mini Knowledge</div><h2 class="sec-title" style="font-size:1.25rem">眉毛の豆知識</h2></section>'
      + '<div class="facts">' + facts + '</div>'
      + '<section class="sec"><div class="kicker" style="margin-bottom:6px">Column</div><h2 class="sec-title" style="font-size:1.25rem">コラム</h2></section>'
      + '<div class="jlist">' + rows + '</div>';
    setView(html, { tab: 'tips' });
  }

  function viewNews() {
    var rows = DB.news.map(function (n) {
      return '<a class="jrow" href="#" onclick="return false">'
        + '<div class="jrow__img cover cover--' + esc(n.cover) + '"></div>'
        + '<div class="jrow__b"><div class="jrow__tag">' + esc(n.cat) + ' · ' + esc(n.date) + '</div>'
        +   '<div class="jrow__title">' + esc(n.title) + '</div>'
        +   '<div class="jrow__meta" style="text-transform:none;letter-spacing:0">' + esc(n.lead) + '</div></div></a>';
    }).join('');
    var html = '<div class="page-head"><div class="kicker">News</div><h1 class="page-head__title">お知らせ</h1>'
      + '<p class="page-head__sub">Naviからの最新情報・キャンペーン。</p></div>'
      + '<div class="jlist">' + rows + '</div>'
      + '<p class="note">※ お知らせ詳細は本番環境で接続予定（デザイン確認用）</p>';
    setView(html, { sub: true, tab: 'home' });
  }

  function viewColumn(id) {
    var c = getColumn(id); if (!c) { go('#/tips'); return; }
    var idx = 0; DB.tips.columns.forEach(function (x, i) { if (x.id === id) idx = i; });
    var body = c.body.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    var html = '<article class="article">'
      + '<div class="article__cover cover ' + coverOf(idx + 1) + '"><span class="cover__motif" style="width:120px;height:120px">' + MOTIF.brow + '</span></div>'
      + '<div class="article__tag">' + esc(c.tag) + '</div>'
      + '<h1 class="article__title">' + esc(c.title) + '</h1>'
      + '<p class="article__sub">' + esc(c.subtitle) + '</p>'
      + '<div class="article__meta">Navi Journal · 約' + c.minutes + ' min read</div>'
      + '<hr class="hairline">'
      + '<p class="article__lead">' + esc(c.lead) + '</p>'
      + body
      + '<a class="btn btn--fill btn--block" style="margin-top:14px" href="#/diagnosis">' + I.scan + ' 自分に合う施術を診断する</a>'
      + '</article>';
    setView(html, { sub: true, tab: 'tips' });
  }

  // ============================================================
  //  ルーター
  // ============================================================
  function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
  function route() {
    var h = location.hash.replace(/^#/, '') || '/';
    var p = h.split('/').filter(Boolean);
    var head = p[0] || '';
    if (head === '') return viewHome();
    if (head === 'diagnosis') return p[1] ? startQuiz(p[1]) : viewDiagList();
    if (head === 'r') return viewResult(p.slice(1).join('/'));
    if (head === 'menu') return viewMenu(p[1]);
    if (head === 'products') return viewProducts();
    if (head === 'news') return viewNews();
    if (head === 'tips') return p[1] ? viewColumn(p[1]) : viewTips();
    return viewHome();
  }

  // ============================================================
  //  シェル / 初期化
  // ============================================================
  function onScroll() {
    var hd = $('.app-header'); if (hd) hd.classList.toggle('solid', window.scrollY > 8);
  }
  function bindShell() {
    var b = $('#backBtn'); if (b) b.addEventListener('click', function () { if (history.length > 1) history.back(); else go('#/'); });
    window.addEventListener('scroll', onScroll, { passive: true });
  }

  window.addEventListener('hashchange', route);
  document.addEventListener('DOMContentLoaded', function () {
    bindShell();
    loadData().then(route).catch(function (e) {
      console.error('[init]', e);
      main().innerHTML = '<section class="sec" style="text-align:center"><p class="hero__lead">データの読み込みに失敗しました。ローカルサーバー経由で開いてください。</p></section>';
    });
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();


</script>
</body>
</html>
